    function QuadrantChart({ lens, tools, hovered, selected, onHover, onSelect }) {
      const pad = 52;
      const w = 560;
      const h = 460;
      const plotW = w - pad * 2;
      const plotH = h - pad * 2;
      const toXY = (t) => {
        const [x, y] = t.pos[lens.id];
        return [pad + (x / 100) * plotW, pad + plotH - (y / 100) * plotH];
      };
      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="chart-wrap" role="img" aria-label={lens.title}>
          <rect x={pad} y={pad} width={plotW / 2} height={plotH / 2} fill="rgba(59,130,246,0.07)" rx="6" />
          <rect x={pad + plotW / 2} y={pad} width={plotW / 2} height={plotH / 2} fill="rgba(16,185,129,0.07)" rx="6" />
          <rect x={pad} y={pad + plotH / 2} width={plotW / 2} height={plotH / 2} fill="rgba(239,68,68,0.05)" rx="6" />
          <rect x={pad + plotW / 2} y={pad + plotH / 2} width={plotW / 2} height={plotH / 2} fill="rgba(245,158,11,0.06)" rx="6" />
          <text x={pad + plotW * 0.25} y={pad + 20} textAnchor="middle" fill="#60A5FA" fontSize="11" fontWeight="700">{lens.labels.tl.name}</text>
          <text x={pad + plotW * 0.75} y={pad + 20} textAnchor="middle" fill="#34D399" fontSize="11" fontWeight="700">{lens.labels.tr.name}</text>
          <text x={pad + plotW * 0.25} y={pad + plotH - 10} textAnchor="middle" fill="#F87171" fontSize="11" fontWeight="700">{lens.labels.bl.name}</text>
          <text x={pad + plotW * 0.75} y={pad + plotH - 10} textAnchor="middle" fill="#FBBF24" fontSize="11" fontWeight="700">{lens.labels.br.name}</text>
          <line x1={pad + plotW / 2} y1={pad} x2={pad + plotW / 2} y2={pad + plotH} stroke="#334155" strokeWidth="1" strokeDasharray="4 4" />
          <line x1={pad} y1={pad + plotH / 2} x2={pad + plotW} y2={pad + plotH / 2} stroke="#334155" strokeWidth="1" strokeDasharray="4 4" />
          <text x={pad + plotW / 2} y={h - 6} textAnchor="middle" fill="#94A3B8" fontSize="12" fontWeight="600">{lens.xLabel}</text>
          <text x={14} y={pad + plotH / 2} textAnchor="middle" fill="#94A3B8" fontSize="12" fontWeight="600" transform={`rotate(-90, 14, ${pad + plotH / 2})`}>{lens.yLabel}</text>
          {tools.map((tool) => {
            const [cx, cy] = toXY(tool);
            const isOn = hovered === tool.name || selected === tool.name;
            const dim = (hovered || selected) && !isOn;
            const color = CATEGORY_COLORS[tool.category] || "#9CA3AF";
            const isMethod = tool.kind === "method";
            return (
              <g key={tool.name}
                onMouseEnter={() => onHover(tool.name)}
                onMouseLeave={() => onHover(null)}
                onClick={() => onSelect(tool.name)}
                style={{ cursor: "pointer" }}
                opacity={dim ? 0.22 : 1}
              >
                {isOn && <circle cx={cx} cy={cy} r="18" fill={color} opacity="0.16" />}
                {isMethod ? (
                  <rect x={cx - 6} y={cy - 6} width="12" height="12" transform={`rotate(45 ${cx} ${cy})`} fill={color} stroke={isOn ? "#fff" : "#0B1120"} strokeWidth="1.5" />
                ) : (
                  <circle cx={cx} cy={cy} r={isOn ? 7 : 5.5} fill={color} stroke={isOn ? "#fff" : "#0B1120"} strokeWidth="1.4" />
                )}
                {isOn && (
                  <text x={cx} y={cy - 16} textAnchor="middle" fill="#F8FAFC" fontSize="11" fontWeight="800">{tool.name}</text>
                )}
              </g>
            );
          })}
        </svg>
      );
    }

              {categories.map((cat) => {
                const on = catFilter === cat;
                const color = cat === "All" ? "#94A3B8" : (CATEGORY_COLORS[cat] || "#94A3B8");
                return (
                  <button key={cat} className={"cat-chip" + (on ? " on" : "")}
                    style={on ? { background: color, color: cat === "All" ? "#0B1120" : "#0B1120" } : { color }}
                    onClick={() => setCatFilter(cat)}>{cat}</button>
                );
              })}
            </div>
          </div>

          <div className="layout">
            <div className="chart-col">
              <div className="panel">
                <h2>{lens.title}</h2>
                <p className="axis-note"><strong>X:</strong> {lens.xDesc} · <strong>Y:</strong> {lens.yDesc}. Click a dot to pin a readout. Caliber is not on this scatter.</p>
                <QuadrantChart
                  lens={lens}
                  tools={visible}
                  hovered={hovered}
                  selected={selected}
                  onHover={setHovered}
                  onSelect={(name) => setSelected(name === selected ? null : name)}
                />
                <p className="axis-note" style={{ margin: "8px 0 0" }}>
                  Showing {visible.length} of {TOTAL_MAPPED}. Positions are Avero’s independent {EDITION} read — verify every compliance claim on the vendor’s current public page before you buy.
                </p>
              </div>

              <div className="callout">
                <div style={{ fontSize: 14, fontWeight: 800, color: "#60A5FA", marginBottom: 4 }}>Before you buy any of these tools</div>
                <div style={{ fontSize: 14, color: "#94A3B8", lineHeight: 1.55 }}>
                  Have you completed <strong style={{ color: "#F1F5F9" }}>Phase Zero</strong>? Data, policy, procurement vehicles, and an executive sponsor beat another pilot. The playbook is in{" "}
                  <a className="gold-link" href="https://startatzero.averoadvisors.com/" target="_blank" rel="noopener noreferrer">Start at Zero</a>.
                </div>
              </div>
            </div>

            <aside className="side">
              {selectedTool ? (
                <div className={"detail" + (selectedTool.kind === "method" ? " method" : "")}>
                  {selectedTool.added && <span className={"badge " + (selectedTool.kind === "method" ? "method" : "new")}>{selectedTool.kind === "method" ? "Avero method · not a vendor SKU" : "New this edition"}</span>}
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#F8FAFC", margin: "8px 0 4px" }}>{selectedTool.name}</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: CATEGORY_COLORS[selectedTool.category], marginBottom: 10 }}>{selectedTool.category}</div>
                  <p style={{ fontSize: 14, color: "#CBD5E1", lineHeight: 1.55, margin: 0 }}>{selectedTool.notes[lens.id] || selectedTool.notes.readiness}</p>
                  {selected && (
                    <button className="chip" style={{ marginTop: 12 }} onClick={() => setSelected(null)}>Clear pin</button>
                  )}
                </div>
              ) : (
                <div className="detail">
                  <div style={{ fontSize: 12, fontWeight: 800, color: "#64748B", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Quadrant guide</div>
                  {Object.entries(lens.labels).map(([key, val]) => {
                    const color = key === "tr" ? "#34D399" : key === "tl" ? "#60A5FA" : key === "br" ? "#FBBF24" : "#F87171";
                    return (
                      <div className="guide-item" key={key}>
                        <div className="guide-dot" style={{ background: color }} />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color }}>{val.name}</div>
                          <div style={{ fontSize: 12, color: "#64748B" }}>{val.desc}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="panel dir">
                <h3>Directory ({visible.length})</h3>
                {grouped.length === 0 && <div className="empty">No matches. Clear search or filters.</div>}
                {grouped.map(({ cat, tools }) => (
                  <div key={cat}>
                    <div className="cat-label" style={{ color: CATEGORY_COLORS[cat] }}>{cat}</div>
                    {tools.map((tool) => (
                      <button
                        key={tool.name}
                        className={"tool-row" + (activeName === tool.name ? " on" : "") + (tool.kind === "method" ? " method-row" : "")}
                        onMouseEnter={() => setHovered(tool.name)}
                        onMouseLeave={() => setHovered(null)}
                        onClick={() => setSelected(tool.name === selected ? null : tool.name)}
                      >
                        <span className={"dot" + (tool.kind === "method" ? " diamond" : "")} style={{ background: CATEGORY_COLORS[tool.category] }} />
                        <span className="tool-name">{tool.name}</span>
                        {tool.added && <span className={"badge " + (tool.kind === "method" ? "method" : "new")}>{tool.kind === "method" ? "Method" : "New"}</span>}
                      </button>
                    ))}
                  </div>
                ))}
              </div>
            </aside>
          </div>

          <section id="report-download" className="download">
            <div className="download-inner">
              <div className="kicker">Free download</div>
              <h2>Get the full {EDITION} Government AI Navigator report</h2>
              <p style={{ fontSize: 15, color: "#94A3B8", lineHeight: 1.65, margin: "0 0 24px" }}>
                Scoring notes, placement rationale, and procurement questions for all {PRODUCT_COUNT} products, plus how Avero uses Caliber as a methodology rail (not a vendor SKU). PDF delivered after the form. {EDITION} edition.
              </p>
              <div
                className="hs-form-frame"
                data-region="na1"
                data-form-id="172f7965-64e6-448f-b7c9-090efd3722e6"
                data-portal-id="24211389"
              ></div>
              <div className="thanks" style={{ display: formSubmitted ? "block" : "none" }}>
                <div style={{ fontSize: 15, fontWeight: 800, color: "#34D399", marginBottom: 6 }}>Thanks — check your inbox for the {EDITION} PDF.</div>
                <div style={{ fontSize: 14, color: "#94A3B8", lineHeight: 1.6 }}>
                  Keep going with{" "}
                  <a className="gold-link" href="https://avavero.substack.com" target="_blank" rel="noopener noreferrer">Start at Zero on Substack</a>
                  {" "}and the book{" "}
                  <a className="gold-link" href="https://startatzero.averoadvisors.com/" target="_blank" rel="noopener noreferrer">Start at Zero</a>.
                </div>
              </div>
              <p style={{ fontSize: 14, color: "#94A3B8", lineHeight: 1.6, margin: "20px 0 0" }}>
                After you download, stay on the buyer’s side: subscribe to{" "}
                <a className="gold-link" href="https://avavero.substack.com" target="_blank" rel="noopener noreferrer">Start at Zero on Substack</a>
                {" "}and get the book at{" "}
                <a className="gold-link" href="https://startatzero.averoadvisors.com/" target="_blank" rel="noopener noreferrer">startatzero.averoadvisors.com</a>.
              </p>
            </div>
          </section>

          <footer className="footer">
            <div>© 2026 Avèro Advisors. Independent analysis. Not affiliated with any vendor listed. Caliber is Avero methodology — not a product on the map.</div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center" }}>
              <a href="https://avavero.substack.com" target="_blank" rel="noopener noreferrer">Start at Zero on Substack</a>
              <a href="https://startatzero.averoadvisors.com/" target="_blank" rel="noopener noreferrer">The book</a>
              <span>Data as of {EDITION} · {PRODUCT_COUNT} products</span>
            </div>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<GovernmentAINavigator />);
  </script>
</body>
</html>
